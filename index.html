<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B2635">
    <meta name="description" content="Guía gastronómica de Talca: locales, menús, reseñas y videos de la comunidad.">
    <title>Mesa Gourmet · Talca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Ingreso y registro -->
        <div id="registerScreen" class="register-screen">
            <div class="glass-card login-card">
                <div class="login-brand">
                    <div class="logo-container logo-animate">
                        <img src="https://pfst.cf2.poecdn.net/base/image/156c78ce329a21ed91b4284f32fbbd517dc2a869bde0f5b06e3e0de06efc6d35?w=500&h=500" alt="Mesa Gourmet" class="brand-logo">
                    </div>
                    <h1 class="brand-title">Mesa Gourmet</h1>
                    <p class="subtitle">Guía gastronómica de Talca</p>
                </div>

                <div class="auth-tabs" role="tablist">
                    <button type="button" class="auth-tab" role="tab" data-action="auth-mode" data-auth-mode="login">Ingresar</button>
                    <button type="button" class="auth-tab" role="tab" data-action="auth-mode" data-auth-mode="register">Crear cuenta</button>
                </div>

                <form id="authForm" class="auth-form" novalidate>
                    <div class="form-group register-only" hidden>
                        <label for="authName">Nombre</label>
                        <div class="input-wrapper"><input type="text" id="authName" autocomplete="name" maxlength="40" placeholder="Tu nombre"></div>
                    </div>
                    <div class="form-group">
                        <label for="authEmail">Correo electrónico</label>
                        <div class="input-wrapper"><input type="email" id="authEmail" autocomplete="email" inputmode="email" placeholder="correo@ejemplo.cl" required></div>
                    </div>
                    <div class="form-group">
                        <label for="authPassword">Contraseña</label>
                        <div class="input-wrapper"><input type="password" id="authPassword" autocomplete="current-password" minlength="8" placeholder="Mínimo 8 caracteres" required></div>
                    </div>
                    <label class="check-row register-only" hidden>
                        <input type="checkbox" id="authTerms">
                        <span>Acepto los <a href="#" data-action="show-terms">términos</a> y la <a href="#" data-action="show-privacy">política de privacidad</a></span>
                    </label>
                    <p class="form-error" id="authError" role="alert" hidden></p>
                    <button type="submit" class="btn-submit" id="authSubmit">Ingresar</button>

                    <div class="divider"><span>o</span></div>

                    <button type="button" class="btn-google" data-action="auth-google">
                        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continuar con Google
                    </button>
                    <button type="button" class="guest-link" data-action="auth-guest">Continuar como invitado</button>
                </form>
            </div>
        </div>

        <!-- Pantalla de carga -->
        <div id="splashScreen" class="splash-screen hidden">
            <div class="splash-content">
                <div class="logo-container logo-animate">
                    <img src="https://pfst.cf2.poecdn.net/base/image/156c78ce329a21ed91b4284f32fbbd517dc2a869bde0f5b06e3e0de06efc6d35?w=500&h=500" alt="" class="brand-logo">
                </div>
                <h1 class="brand-title">Mesa Gourmet</h1>
                <p class="brand-subtitle">Cocinando experiencias en Talca</p>
            </div>
        </div>

        <!-- Cabecera -->
        <header id="mainHeader" class="app-header hidden">
            <div class="header-top glass-panel">
                <button class="header-brand" data-action="nav" data-tab="inicio" aria-label="Ir al inicio">
                    <img src="https://pfst.cf2.poecdn.net/base/image/156c78ce329a21ed91b4284f32fbbd517dc2a869bde0f5b06e3e0de06efc6d35?w=500&h=500" alt="" class="mini-logo">
                    <h2>Mesa Gourmet</h2>
                </button>
                <button class="profile-btn nav-tab" data-action="nav" data-tab="perfil">
                    <span class="avatar" id="userAvatar">G</span>
                    <span id="userName">Invitado</span>
                </button>
            </div>

            <div class="search-container">
                <div class="search-input-wrapper glass-panel">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                    <input type="search" id="searchInput" placeholder="Busca locales, platos o características…" autocomplete="off" aria-label="Buscar">
                </div>
                <div id="searchOptionsPanel" class="search-panel hidden glass-panel">
                    <div class="panel-section">
                        <h3>Categorías</h3>
                        <div class="quick-grid">
                            <button class="search-option" data-action="quick-search" data-search="todo">🍽️ Todo</button>
                            <button class="search-option" data-action="quick-search" data-search="restaurantes">🏪 Restaurantes</button>
                            <button class="search-option" data-action="quick-search" data-search="café">☕ Cafeterías</button>
                            <button class="search-option" data-action="quick-search" data-search="comida rápida">🍔 Comida rápida</button>
                        </div>
                        <h3>Tipos de comida</h3>
                        <div class="quick-pills">
                            <button class="search-option-pill" data-action="quick-search" data-search="sushi">🍣 Sushi</button>
                            <button class="search-option-pill" data-action="quick-search" data-search="pasta">🍝 Pasta</button>
                            <button class="search-option-pill" data-action="quick-search" data-search="completo">🌭 Completos</button>
                            <button class="search-option-pill" data-action="quick-search" data-search="empanadas">🥟 Empanadas</button>
                            <button class="search-option-pill" data-action="quick-search" data-search="ceviche">🦐 Ceviche</button>
                        </div>
                        <h3>Características</h3>
                        <div class="quick-grid">
                            <button class="search-option" data-action="quick-search" data-search="vegetariano">🥬 Vegetariano</button>
                            <button class="search-option" data-action="quick-search" data-search="wifi">📶 WiFi</button>
                            <button class="search-option" data-action="quick-search" data-search="terraza">🪑 Terraza</button>
                            <button class="search-option" data-action="quick-search" data-search="mascotas">🐾 Pet-friendly</button>
                            <button class="search-option" data-action="quick-search" data-search="calefacción">🔥 Calefacción</button>
                            <button class="search-option" data-action="quick-search" data-search="alcohol">🍺 Venta de alcohol</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main id="mainContent" class="main-content hidden"></main>

        <!-- Ficha del local -->
        <div id="detailView" class="detail-view hidden">
            <div id="detailContent" class="detail-content"></div>
        </div>

        <!-- Filtros dietéticos -->
        <div id="filterModal" class="detail-view filter-modal hidden" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
            <div class="detail-header filter-header">
                <button class="back-btn" data-action="close-filters">✕ Cerrar</button>
                <h1 id="filterTitle">Preferencias</h1>
                <p>Filtra los locales que ves en el inicio</p>
            </div>
            <div class="filter-body">
                <p class="filter-label">Restricciones alimentarias</p>
                <button id="dietBtn_vegano" class="diet-btn" data-action="toggle-diet" data-diet="vegano" aria-pressed="false">🌱 Vegano</button>
                <button id="dietBtn_celiaco" class="diet-btn" data-action="toggle-diet" data-diet="celiaco" aria-pressed="false">🌾 Celíaco (sin gluten)</button>
                <button id="dietBtn_sinLactosa" class="diet-btn" data-action="toggle-diet" data-diet="sinLactosa" aria-pressed="false">🥛 Sin lactosa</button>
                <button class="btn btn-primary filter-apply" data-action="close-filters">Aplicar 🎛️</button>
            </div>
        </div>

        <!-- Barra inferior -->
        <nav id="bottomNav" class="bottom-nav hidden glass-panel" aria-label="Secciones">
            <div class="nav-items">
                <button class="nav-tab" data-action="nav" data-tab="mapa"><span class="nav-icon">🗺️</span><span class="nav-text">Mapa</span></button>
                <button class="nav-tab" data-action="nav" data-tab="top50"><span class="nav-icon">🏆</span><span class="nav-text">Top 50</span></button>
                <button class="nav-tab active-tab" data-action="nav" data-tab="inicio" aria-label="Inicio"><span class="fab-wrapper"><span class="nav-icon fab-icon">🏠</span></span></button>
                <button class="nav-tab" data-action="nav" data-tab="misiones"><span class="nav-icon">🎯</span><span class="nav-text">Misiones</span></button>
                <button class="nav-tab" data-action="nav" data-tab="resenas"><span class="nav-icon">⭐</span><span class="nav-text">Reseñas</span></button>
            </div>
        </nav>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
