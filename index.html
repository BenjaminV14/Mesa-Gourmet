<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B2635">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mesa Gourmet">
    <meta name="description" content="Guía gastronómica de Talca: locales, menús, reseñas y videos de la comunidad.">
    <title>Mesa Gourmet · Talca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Ingreso y registro -->
        <div id="registerScreen" class="register-screen">
            <div class="glass-card login-card">
                <div class="login-brand">
                    <div class="logo-container logo-animate">
                        <img src="/src/assets/logo-mesa-gourmet.jpg" alt="Mesa Gourmet" class="brand-logo">
                    </div>
                    <h1 class="brand-title">Mesa Gourmet</h1>
                    <p class="subtitle">Guía gastronómica de Talca</p>
                </div>

                <div class="auth-tabs" role="tablist">
                    <button type="button" class="auth-tab" role="tab" data-action="auth-mode" data-auth-mode="login">Ingresar</button>
                    <button type="button" class="auth-tab" role="tab" data-action="auth-mode" data-auth-mode="register">Crear cuenta</button>
                </div>

                <form id="authForm" class="auth-form" novalidate>
                    <div class="form-group register-only" hidden>
                        <label for="authName">Nombre</label>
                        <div class="input-wrapper"><input type="text" id="authName" autocomplete="name" maxlength="40" placeholder="Tu nombre"></div>
                    </div>
                    <div class="form-group">
                        <label for="authEmail">Correo electrónico</label>
                        <div class="input-wrapper"><input type="email" id="authEmail" autocomplete="email" inputmode="email" placeholder="correo@ejemplo.cl" required></div>
                    </div>
                    <div class="form-group">
                        <label for="authPassword">Contraseña</label>
                        <div class="input-wrapper"><input type="password" id="authPassword" autocomplete="current-password" minlength="8" placeholder="Mínimo 8 caracteres" required></div>
                    </div>
                    <button type="button" class="link-btn auth-forgot login-only" data-action="auth-forgot">¿Olvidaste tu contraseña?</button>
                    <label class="check-row register-only" hidden>
                        <input type="checkbox" id="authTerms">
                        <span>Acepto los <a href="#" data-action="show-terms">términos</a> y la <a href="#" data-action="show-privacy">política de privacidad</a></span>
                    </label>
                    <p class="form-error" id="authError" role="alert" hidden></p>
                    <p class="form-info" id="authInfo" role="status" hidden></p>
                    <button type="submit" class="btn-submit" id="authSubmit">Ingresar</button>

                    <div class="divider"><span>o</span></div>

                    <button type="button" class="btn-google" data-action="auth-google">
                        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continuar con Google
                    </button>
                    <button type="button" class="guest-link" data-action="auth-guest">Continuar como invitado</button>
                </form>
            </div>
        </div>

        <!-- Pantalla de carga -->
        <div id="splashScreen" class="splash-screen hidden">
            <div class="splash-content">
                <div class="logo-container logo-animate">
                    <img src="/src/assets/logo-mesa-gourmet.jpg" alt="" class="brand-logo">
                </div>
                <h1 class="brand-title">Mesa Gourmet</h1>
                <p class="brand-subtitle">Cocinando experiencias en Talca</p>
            </div>
        </div>

        <!-- Cabecera -->
        <header id="mainHeader" class="app-header hidden">
            <div class="header-top glass-panel">
                <button class="header-brand" data-action="nav" data-tab="inicio" aria-label="Ir al inicio">
                    <img src="/src/assets/logo-mesa-gourmet.jpg" alt="" class="mini-logo">
                    <h2>Mesa Gourmet</h2>
                </button>
                <button class="profile-btn nav-tab" data-action="nav" data-tab="perfil">
                    <span class="avatar" id="userAvatar">G</span>
                    <span id="userName">Invitado</span>
                </button>
            </div>

            <div class="search-container">
                <div class="search-input-wrapper glass-panel">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                    <input type="search" id="searchInput" placeholder="¿Qué se te antoja hoy?" autocomplete="off" aria-label="Buscar locales, platos o características" enterkeyhint="search">
                </div>
                <div id="searchOptionsPanel" class="search-panel hidden glass-panel" role="listbox" aria-label="Sugerencias de búsqueda"></div>
            </div>
        </header>

        <main id="mainContent" class="main-content hidden"></main>

        <!-- Ficha del local -->
        <div id="detailView" class="detail-view hidden">
            <div id="detailContent" class="detail-content"></div>
        </div>
        <div id="detailBackdrop" class="detail-backdrop" data-action="close-local" aria-hidden="true"></div>

        <!-- Barra inferior -->
        <nav id="bottomNav" class="bottom-nav hidden glass-panel" aria-label="Secciones">
            <button class="nav-brand" data-action="nav" data-tab="inicio" aria-label="Mesa Gourmet, ir al inicio">
                <img src="/src/assets/logo-mesa-gourmet.jpg" alt="" class="mini-logo">
                <span><b>Mesa Gourmet</b><small>Guía gastronómica de Talca</small></span>
            </button>
            <div class="nav-items">
                <button class="nav-tab" data-action="nav" data-tab="mapa"><span class="nav-icon">🗺️</span><span class="nav-text">Mapa</span></button>
                <button class="nav-tab" data-action="nav" data-tab="top50"><span class="nav-icon">🏆</span><span class="nav-text">Top 50</span></button>
                <button class="nav-tab active-tab" data-action="nav" data-tab="inicio" aria-label="Inicio"><span class="fab-wrapper"><span class="nav-icon fab-icon">🏠</span></span><span class="nav-text nav-text-desktop">Inicio</span></button>
                <button class="nav-tab" data-action="nav" data-tab="misiones"><span class="nav-icon">🎯</span><span class="nav-text">Misiones</span></button>
                <button class="nav-tab" data-action="nav" data-tab="resenas"><span class="nav-icon">⭐</span><span class="nav-text">Reseñas</span></button>
            </div>
            <button class="install-btn" id="installBtn" data-action="install-app" hidden>📲 Instalar la app</button>
        </nav>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
